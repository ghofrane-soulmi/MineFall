# Deploys to the VPS after CI succeeded on main. Needs these repository secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), optional VPS_PATH (default ~/minefall)
# Without them the job is skipped with a notice. Server setup: see deploy/README.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH: ${{ secrets.VPS_PATH || '~/minefall' }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::Deploy skipped: VPS_HOST / VPS_USER / VPS_SSH_KEY secrets are not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull and restart on the VPS
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd $VPS_PATH && git fetch --quiet origin main && git reset --hard origin/main \
             && docker compose up -d --build --remove-orphans && docker image prune -f"
